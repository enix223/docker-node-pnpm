name: Build and deploy to docker hub

on:
  push:
    tags:
      - '*'

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 22 (LTS)
          - node: 22.23.3-bookworm
            pnpm: 10.10.0
          - node: 22.23.3-bookworm
            pnpm: 11.28.6
          - node: 22.23.3-bookworm
            pnpm: 12.14.0

          # Node 24 (LTS)
          - node: 24.22.0-bookworm
            pnpm: 10.10.0
          - node: 24.22.0-bookworm
            pnpm: 11.28.6
          - node: 24.22.0-bookworm
            pnpm: 12.14.0

          # Node 26 (LTS from 2026-10-28)
          - node: 26.12.0-bookworm
            pnpm: 10.10.0
          - node: 26.12.0-bookworm
            pnpm: 11.28.6
          - node: 26.12.0-bookworm
            pnpm: 12.14.0

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build node-${{ matrix.node }} + pnpm@${{ matrix.pnpm }}
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64, linux/arm64/v8
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            PNPM_VERSION=${{ matrix.pnpm }}
          file: Dockerfile
          push: true
          tags: |
            enix223/node-pnpm:${{ matrix.node }}_${{ matrix.pnpm }}
